<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书香闽江 AI 智能助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(160deg, #eaf2f8 0%, #f7fafc 60%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      height: min(760px, 94vh);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(31, 58, 95, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, #1f3a5f, #2e74b5);
      color: #fff;
      padding: 16px 18px 14px;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header p { font-size: 12px; opacity: 0.85; margin-top: 3px; }
    .chips {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      background: #f0f6fb;
      border-bottom: 1px solid #e3edf5;
      flex-shrink: 0;
    }
    .chip {
      flex-shrink: 0;
      background: #fff;
      border: 1px solid #c9d4e4;
      color: #1f3a5f;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { background: #e7f0f9; border-color: #2e74b5; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fbfdfe;
    }
    .msg { display: flex; max-width: 86%; }
    .msg.user { align-self: flex-end; }
    .msg.bot { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: #1f3a5f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot .bubble {
      background: #fff;
      color: #263238;
      border: 1px solid #e3edf5;
      border-bottom-left-radius: 4px;
    }
    .typing .bubble { color: #8a97a5; font-style: italic; }
    .inputbar {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #e3edf5;
      background: #fff;
    }
    .inputbar input {
      flex: 1;
      border: 1px solid #c9d4e4;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
    }
    .inputbar input:focus { border-color: #2e74b5; }
    .inputbar button {
      border: none;
      border-radius: 20px;
      background: #1f3a5f;
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    .inputbar button:active { opacity: .8; }
    footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #8a97a5;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>书香闽江 AI 智能助手</h1>
      <p>鼓岭·新华驿站 · 智能客服 Demo（大模型 + 知识库）</p>
    </header>
    <div class="chips" id="chips">
      <span class="chip">房价多少？</span>
      <span class="chip">几点入住退房？</span>
      <span class="chip">能停车吗？有早餐吗？</span>
      <span class="chip">周边有什么好玩的？</span>
      <span class="chip">怎么到鼓岭？</span>
      <span class="chip">一日游怎么安排？</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="请输入您的问题…" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <footer>AI 智能客服 · 演示版 · 回答基于酒店知识库</footer>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let history = [];

    function addMsg(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg bot typing';
      wrap.id = 'typing';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = '正在思考…';
      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function send(text) {
      text = (text || '').trim();
      if (!text) return;
      addMsg('user', text);
      inputEl.value = '';
      showTyping();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history })
        });
        const data = await res.json();
        removeTyping();
        addMsg('bot', data.reply);
        history.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
        if (history.length > 20) history = history.slice(-20);
      } catch (e) {
        removeTyping();
        addMsg('bot', '网络开小差了，请稍后再试。');
      }
    }

    sendBtn.addEventListener('click', () => send(inputEl.value));
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(inputEl.value); });
    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.classList.contains('chip')) send(e.target.textContent);
    });

    addMsg('bot', '您好，我是书香闽江 AI 助手，很高兴为您服务～\n可以问我房价、入住时间、周边景点、交通路线等问题。');
  </script>
</body>
</html>
